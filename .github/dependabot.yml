version: 2
updates:
  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    rebase-strategy: auto
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    open-pull-requests-limit: 5

  # Application dependencies (root). Dev minor/patch and prod patch are grouped into a single PR
  # to limit noise; majors arrive as individual PRs to review.
  #
  # `bun`, not `npm`: the npm ecosystem does not know `bun.lock`, so it opens PRs that touch only
  # package.json - and every pipeline here installs with `--frozen-lockfile`, which rejects exactly
  # that. The PRs would open and every one of them would fail.
  - package-ecosystem: 'bun'
    directory: '/'
    rebase-strategy: auto
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'bun'
    open-pull-requests-limit: 5
    # `typescript` STAYS on 6, and that is not a refusal of TS 7 - `check` already runs it. TS 7
    # arrives through `@typescript/native` (npm:typescript@^7), a DISTINCT package, because
    # svelte-check needs both majors present: 6 for its own API, 7 behind `--tsgo`. A major on
    # `typescript` itself would replace the stable compiler svelte-check is using, and
    # l'auto-merge fusionne une PR verte sans que personne regarde.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'patch'
