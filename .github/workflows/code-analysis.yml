name: Code Analysis

on:
  pull_request:
    branches: [main]
  schedule:
    # Analyse de securite quotidienne a 2h UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One language, not two. `typescript` is an ALIAS of `javascript` in CodeQL, not a second
      # target: the matrix that named both ran the identical analysis twice and filed every finding
      # twice. `javascript-typescript` is the single canonical name for the pair.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended, security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          extra_args: --debug --only-verified
        continue-on-error: true

  code-quality:
    name: Code Quality (oxlint + SonarCloud)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # sonarcloud-github-action is DEPRECATED and archived; sonarqube-scan-action is its drop-in
      # replacement for both Cloud and Server. The one difference is SONAR_HOST_URL, which the old
      # action hard-coded and this one requires.
      - name: SonarQube Cloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        continue-on-error: true

  # This job did not exist: nothing in this repository checked a dependency for a published
  # advisory, and nothing checked the one invariant that keeps Dependabot able to open the pull
  # request that would fix it.
  dependencies:
    name: Check Dependencies Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      # `lucide-svelte` is the DEPRECATED package name; `@lucide/svelte` is where releases land.
      # Both still resolve and both render the same glyphs, so a stray import is invisible until
      # the old name stops being published. oxlint's `no-restricted-imports` was measured and
      # rejected as the guard: it fires on `.ts`, but oxvelte does NOT apply it inside a `.svelte`
      # `<script>` block, which is where almost every icon import lives - a rule covering the
      # minority would read as a guarantee. A grep over tracked files covers both.
      - name: Guard the lucide package name
        run: |
          set -uo pipefail
          if git grep -nE "from ['\"]lucide-svelte['\"]|\"lucide-svelte\"[[:space:]]*:" -- .; then
            echo "::error::'lucide-svelte' is the deprecated package name - import from '@lucide/svelte'"
            exit 1
          fi

      # THE INVARIANT THAT KEEPS DEPENDABOT ALIVE. Dependabot bundles bun 1.3.14 with
      # `MAX_SUPPORTED_LOCKFILE_VERSION = 1` (dependabot-core#15896) and answers
      # `DependencyFileNotSupported` to a `lockfileVersion: 2` lockfile - so a v2 lockfile means NO
      # dependency updates for this repository, and the symptom is an ABSENCE of pull requests,
      # which nobody notices. bun >= 1.4 writes v2 for a lockfile it creates from nothing, and
      # rewrites an existing v1 to v3 when the manifest holds NESTED `overrides`. It is enforced
      # here rather than by pinning the toolchain, because `.bun-version` never governed a
      # contributor's own bun, and deleting bun.lock before reinstalling is all it takes.
      - name: Guard the bun lockfile version
        run: |
          set -uo pipefail
          bad=""
          while IFS= read -r lock; do
            v="$(grep -m1 -o '"lockfileVersion"[[:space:]]*:[[:space:]]*[0-9]*' "$lock" | grep -o '[0-9]*$')"
            echo "--- $lock: lockfileVersion=${v:-MISSING}"
            [ "$v" = "1" ] || bad="$bad $lock"
          done < <(git ls-files '*bun.lock')
          if [ -n "$bad" ]; then
            echo "::error::bun lockfile version must be 1 (Dependabot cannot read v2):$bad"
            exit 1
          fi

      # No `continue-on-error`: a gate that cannot go red reports nothing. A new advisory against a
      # dependency already shipped is exactly the event this job exists to announce.
      - name: Audit dependencies
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=moderate
