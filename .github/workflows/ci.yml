name: CI

# Validation (lint / type-check / build / tests) on PRs and, via workflow_call,
# as the CD gate (cd.yml calls it before building/deploying the image).
# No `push` trigger: on main, the CD runs this CI exactly once.
#
# Bun is the package manager, Node is the runtime, and the split is measured, not
# stylistic: bun as a RUNTIME inflated request-body reads ~80x and retained the
# memory (unfixed upstream bug), which OOM-killed prod, and it segfaults outright
# on better-sqlite3 (a V8-ABI addon). So bun installs and drives the scripts here,
# and every step that executes application code executes it under Node.
on:
 pull_request:
  branches: [main]
 workflow_call:

jobs:
 validate:
  name: Validate
  runs-on: ubuntu-latest
  steps:
   - name: Checkout
     uses: actions/checkout@v7

   - name: Setup Node
     uses: actions/setup-node@v7
     with:
      node-version: 24

   - name: Setup Bun
     uses: oven-sh/setup-bun@v2
     with:
      bun-version-file: '.bun-version'

   - name: Install dependencies
     run: bun install --frozen-lockfile

   - name: Type check
     run: bun run check

   - name: Lint
     env:
      NODE_OPTIONS: '--max-old-space-size=16384'
     run: bun run lint

   # A husky pre-commit hook is not a gate: `--no-verify` skips it, and it never runs on a pull
   # request at all. Prettier only counts once something red says so.
   - name: Check formatting
     run: bun run format:check

   - name: Build
     run: bun run build

   - name: Setup test database
     run: |
      mkdir -p data
      bun run db:init || true

   - name: Create .env for tests
     run: |
      cat > .env << 'EOF'
      ENABLE_DEV_ROUTES=true
      DATABASE_PATH=./data/migallery.db
      IMMICH_BASE_URL=
      IMMICH_API_KEY=
      AUTH_TRUSTED_HOST=true
      EOF

   - name: Run tests
     env:
      API_BASE_URL: http://localhost:3000
     run: bun run test
