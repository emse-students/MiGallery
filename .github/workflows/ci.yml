name: CI

# Validation (lint / type-check / build / tests) on every pull request AND on `main`, ending in the
# one check a ruleset requires: `CI passed`.
#
# bun is BOTH the package manager and the runtime. It was package-manager-only for
# two measured reasons, both re-measured on bun 1.4.0: the ~80x request-body read
# inflation that OOM-killed prod is GONE (2.2 GB of bodies: bun 211 MB RSS against
# node's 248 MB), and the better-sqlite3 segfault is still real but no longer
# applies, because the app now uses `bun:sqlite` and better-sqlite3 is removed.
# There is no node on this runner: a step running under a runtime production does
# not use is a step that can go green while prod is broken.
on:
  pull_request:
    branches: [main]
  # THE TRUNK IS TESTED TOO, and it was not until 2026-09-04. This file ran on pull requests only,
  # and `cd.yml` re-called it on a push - so the verdict on `main` existed inside a DEPLOYMENT run
  # rather than as a check on the commit. Nothing could then ask "is `main` green?" without knowing
  # which deploy to look inside, and the release gate that now asks exactly that had nothing to
  # read. Every sibling repository has run its suite on `push: main` for months.
  push:
    branches: [main]
  # A HAND RE-RUN OF THE SUITE ON `main`, after an infrastructure fault.
  #
  # NO `workflow_call`, REMOVED WITH THE THING THAT CALLED IT: `cd.yml`'s `run-ci` job was the only
  # caller, and it is gone with the push-deploy it gated. A trigger nothing uses is a claim a file
  # makes about itself that is not true.
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # WHAT IS LINTED MOVED ON 2026-09-04, AND THE STEP STAYED. It read `.github/scripts/`, which
      # held the auto-merge sweep and nothing else; that whole mechanism is deleted, and `scripts/`
      # is what is left - the offsite backup and restore, which touch real data on a real box and
      # are the shell in this repository most worth a linter. A gate pointed at a directory that no
      # longer exists fails on the directory rather than on the code, which reads like a broken
      # pipeline instead of a missing check.
      #
      # THE VERSION IS PINNED AND THE RUNNER'S OWN COPY IS IGNORED. `ubuntu-latest` ships a
      # shellcheck, but which one is the image's business and it moves without this repository
      # changing - a floating linter is the same defect as an unverified one, arriving later. The
      # digest is of the archive that produced the run described above, so CI lints with the binary
      # whose verdict was actually read.
      - name: Lint the CI scripts
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSLf -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x \
            scripts/*.sh .github/scripts/*.sh .github/scripts/tests/*.sh

      # AND THE ONE SHELL SCRIPT WITH A DECISION IN IT IS RUN, not merely parsed.
      # `audit-dependencies.sh` classifies an npm 503 as "no verdict" and a real advisory as a
      # finding, from the SAME exit code - a distinction that is either asserted on both sides
      # or is a comment. The test needs no network: it runs the real script against a fake
      # `bun` on `PATH`, which is what makes the outage case reproducible when the incident
      # itself was not.
      - name: Test the audit classifier
        run: bash .github/scripts/tests/audit-dependencies.test.sh

      # AND THE GATES THAT DECIDE WHETHER A RELEASE MAY START. Three questions, asserted on BOTH
      # sides of each - a gate known to pass is not a gate known to be able to refuse. No network:
      # `gh` is a fake on `PATH` that answers from the environment.
      - name: Test the release gates
        run: bash .github/scripts/tests/release-preflight.test.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      # oxvelte is a Rust binary published on no registry, built from the revision
      # scripts/install-oxvelte.sh pins. Without this cache the shim rebuilt it on EVERY run - a
      # couple of minutes of every pipeline, spent silently inside a step named "Lint". The key
      # names the revision, so it must move when OXVELTE_REV does.
      - name: Cache oxvelte build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/oxvelte
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: oxvelte-7196779a-${{ runner.os }}

      # `bun run lint` is oxlint + oxvelte. The oxvelte half goes through the shim, which installs
      # the pinned revision when the cache did not restore it - so this step also proves the shim
      # works on a clean runner.
      - name: Lint
        run: bun run lint

      # A husky pre-commit hook is not a gate: `--no-verify` skips it, and it never runs on a pull
      # request at all. The formatter only counts once something red says so.
      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Setup test database
        run: |
          mkdir -p data
          bun run db:init || true

      - name: Create .env for tests
        run: |
          cat > .env << 'EOF'
          ENABLE_DEV_ROUTES=true
          DATABASE_PATH=./data/migallery.db
          IMMICH_BASE_URL=
          IMMICH_API_KEY=
          AUTH_TRUSTED_HOST=true
          EOF

      - name: Run tests
        env:
          API_BASE_URL: http://localhost:3000
        run: bun run test

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE SECURITY PASS, AND IT CAN NOW STOP A MERGE
  #
  # CodeQL, the TruffleHog secret scan and the rest ran on every pull request from their own
  # workflow until 2026-09-04 - and could not block one, because nothing required them. They are now
  # a called job of this workflow, so they reach `CI passed` below, which is the check the branch
  # ruleset requires. THE PERMISSIONS ARE DERIVED FROM WHAT THE CALLEE DECLARES: a caller caps a
  # called workflow, and exceeding that cap is a startup failure with no log and no annotation.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  security:
    name: Security
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/code-analysis.yml

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE IMAGE IS BUILT HERE TOO, BECAUSE OTHERWISE NOTHING BUILDS IT UNTIL A RELEASE
  #
  # A GREEN GATE IS NOT A WORKING SYSTEM. Until 2026-09-04 the `Dockerfile` was compiled by exactly
  # one thing - the deploy - so a change that broke it was discovered while shipping, by the only
  # run that could no longer fall back on anything. The suite above proves the SOURCE builds; it
  # says nothing about the image that source is shipped in, and the two fail for entirely different
  # reasons: a base tag that moved, a missing system package, a COPY path that changed.
  #
  # `push: false` AND `load: false` - this asks whether the image BUILDS and nothing else. Nothing
  # is published from a pull request, and the registry credentials are not available here anyway.
  # The gha cache is shared with the deploy's build, so the deploy pays less than this job does.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  image:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # THE SAME ONE FILE THE DEPLOY READS. `.bun-version` is the only place this repository names a
      # bun version; if this job read it differently from `deploy.yml`, what is tested here would
      # not be what ships.
      - name: The bun version the image is built on, read from the one file that names it
        id: bun
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          build-args: |
            BUN_VERSION=${{ steps.bun.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE ONE CHECK A RULESET CAN REQUIRE
  #
  # A rule naming an individual job would name one whose presence can change; this one exists on
  # every run of this workflow and reads the others' results. `success` AND `skipped` both pass - a
  # skipped job is one with nothing to do, and treating that as a failure is how a required check
  # becomes a wall.
  #
  # IT MUST HAVE `if: always()`. Without it a failed dependency SKIPS this job, and a skipped
  # required check never reports at all: the pull request waits for ever on a green tick that is not
  # coming, which reads exactly like a slow runner.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  ci-passed:
    name: CI passed
    if: always()
    needs: [validate, image, security]
    runs-on: ubuntu-latest
    steps:
      - name: Did everything pass?
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "::error::CI did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "every CI job passed or was skipped as having nothing to do"
