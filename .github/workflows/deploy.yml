# =================================================================================================
# DEPLOY THIS REPOSITORY'S ONE ESTATE - A LIBRARY, CALLED ONLY BY `release.yml`
#
# NO TRIGGERS OF ITS OWN, AND NO ROW OF ITS OWN IN THE ACTIONS LIST, since 2026-09-04. This was
# `cd.yml`, on `push: main`, so every merge was a deployment: production was whatever the last green
# pull request happened to be, and nobody chose it. **Nothing deploys on a push any more** -
# `release.yml` is the only caller, in every repository of the ecosystem.
#
# ITS FIRST JOB USED TO BE `run-ci`, WHICH RE-RAN THE WHOLE SUITE. The tests had already run on that
# exact commit; a second run is a second opinion about the same tree, and it is the one that ships.
# The release preflight READS the verdict that already exists instead, which is both cheaper and
# stricter - it also refuses an ABSENT check, which a re-run cannot even notice.
#
# IT IS HANDED A COMMIT AND A VERSION rather than working them out. The caller has already put them
# through the gates; recomputing them here would be a second opinion about what is being shipped.
# =================================================================================================
name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit to build and ship. Resolved and gated by the caller.'
        required: true
        type: string
      version:
        description: 'The version being released, without a leading `v`. Becomes an image tag.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit the caller gated, never `github.sha` - which on a `release` event is the tag
          # and on a dispatch is whatever the branch happens to be by then.
          ref: ${{ inputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/emse-students/migallery
          # THREE TAGS, AND THE VERSION IS THE ONE THAT MATTERS. `latest` is what the deploy
          # pulls; the sha tag is how a running container is traced back to a tree; and
          # `v<version>` is how it is traced back to the RELEASE somebody published, which is the
          # only one of the three a human ever says out loud.
          #
          # `enable={{is_default_branch}}` is gone with the push trigger it was written for: this
          # workflow now runs only from a release, whose commit is on `main` by gate 2, so the
          # condition was always true and read as though it might not be.
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ inputs.version }}
            type=sha,prefix=main-

      # `.bun-version` IS THE ONE PLACE THIS REPOSITORY NAMES A BUN VERSION, and until 2026-09-04
      # the Dockerfile named it a second time. Two copies of a version drift in one direction only:
      # `setup-bun` in CI reads the file, the image did not, so a tree could be tested on one bun
      # and shipped on another with nothing anywhere reporting the difference. Read once here; the
      # Dockerfile's ARG default is now only what a bare `docker build` falls back to.
      - name: The bun version the image is built on, read from the one file that names it
        id: bun
        run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUN_VERSION=${{ steps.bun.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /home/mitv/MiGallery
      COMPOSE: docker compose -f /home/mitv/MiGallery/docker-compose.prod.yml --project-directory /home/mitv/MiGallery
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The same commit the image was built from, so the compose file and the scripts synced
          # to the box describe the image that is about to run.
          ref: ${{ inputs.sha }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate .env from secrets
        env:
          IMMICH_API_KEY: ${{ secrets.IMMICH_API_KEY }}
          MICONNECT_CLIENT_ID: ${{ secrets.MICONNECT_CLIENT_ID }}
          MICONNECT_CLIENT_SECRET: ${{ secrets.MICONNECT_CLIENT_SECRET }}
        run: |
          for v in IMMICH_API_KEY MICONNECT_CLIENT_ID MICONNECT_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Secret GitHub manquant: $v"; exit 1; fi
          done
          mkdir -p "$DEPLOY_DIR"
          umask 077
          {
            printf 'IMMICH_API_KEY=%s\n' "$IMMICH_API_KEY"
            printf 'MICONNECT_CLIENT_ID=%s\n' "$MICONNECT_CLIENT_ID"
            printf 'MICONNECT_CLIENT_SECRET=%s\n' "$MICONNECT_CLIENT_SECRET"
          } > "$DEPLOY_DIR/.env"

      - name: Sync deploy files
        run: |
          cp docker-compose.prod.yml "$DEPLOY_DIR/"
          mkdir -p "$DEPLOY_DIR/scripts"
          cp scripts/backup-offsite.sh scripts/restore-offsite.sh "$DEPLOY_DIR/scripts/"
          chmod +x "$DEPLOY_DIR/scripts/backup-offsite.sh" "$DEPLOY_DIR/scripts/restore-offsite.sh"

      - name: Pull image
        run: $COMPOSE pull

      - name: Deploy
        run: $COMPOSE up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then echo "✅ MiGallery healthy"; exit 0; fi
            sleep 3
          done
          echo "::error::Health check KO apres deploiement"
          $COMPOSE logs --tail 50
          exit 1

      - name: Cleanup Docker
        run: |
          docker image prune -af --filter 'until=24h' || true
          docker builder prune -af --filter 'until=168h' || true
