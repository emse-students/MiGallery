<!doctype html>
<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="view-transition" content="same-origin" />
    <!-- One set, generated from the 2026 logo (docs/wiki/logo.md): the .ico for the browsers that
         still ask for it, the PNG for the rest, an opaque apple-touch-icon because iOS paints a
         transparent one black. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable to a home screen (ui-redesign #22): standalone, opens on the albums list. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Web fonts: Inter (body/UI) + Space Grotesk (headings). preconnect + display=swap
		     so text stays visible while the font loads; only the used weights are fetched. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <!-- The theme before the first paint: the same rule as src/lib/theme-preference.ts (parsePreference +
         resolveTheme), inline because a store only runs after hydration, which painted a light
         user dark for a frame. Keep the two in step. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        console.warn('theme: localStorage unreadable, painting dark', e);
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
